[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-ml"
version = "0.1.0"
description = "Crypto ML indicators, backtesting, and walk-forward demo"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "yfinance>=0.2.30",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

